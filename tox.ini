[tox]
envlist = py312,ruff,mypy
isolated_build = true

[testenv]
allowlist_externals = uv
skip_install = true

[testenv:py312]
commands =
    uv sync --dev
    uv run pytest tests/ -v --cov=app --cov=client --cov=logger --cov-report=term-missing

[testenv:ruff]
commands =
    uv sync --dev
    uv run ruff check .
    uv run ruff format --check .

[testenv:mypy]
commands =
    uv sync --dev
    uv run mypy app.py client.py logger.py metrics.py config.py
