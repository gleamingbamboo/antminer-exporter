[tox]
envlist = py312,ruff,mypy
isolated_build = true

[testenv]
allowlist_externals = uv
skip_install = true

[testenv:py312]
commands =
    uv sync --dev
    uv run pytest tests/ -v --cov=antminer_exporter.app --cov=antminer_exporter.client --cov=antminer_exporter.logger --cov-report=term-missing

[testenv:ruff]
commands =
    uv sync --dev
    uv run ruff check .
    uv run ruff format --check .

[testenv:mypy]
commands =
    uv sync --dev
    uv run mypy antminer_exporter/
